[project]
name = "ai-customer-assistant"
version = "1.0.0"
description = "AI customer assistant: answers from your own documents in FR/EN/AR, captures leads to Google Sheets, n8n follow-ups."
readme = "README.md"
authors = [
    { name = "Mohamed Amine", email = "benafiamohamedamine@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "openai>=3.55.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # Depends() in defaults is idiomatic; the formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.vercel]
entrypoint = "app.main:app"
