name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@localhost:5432/assistant
      TEST_DATABASE_URL: postgresql+psycopg://assistant:assistant@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Create test database
        run: PGPASSWORD=assistant psql -h localhost -U assistant -c "create database assistant_test"
      - name: Tests (PostgreSQL + pgvector, keyless mock LLM)
        run: uv run pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and smoke-test it
        run: |
          docker compose up -d --build --wait db api
          curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/api/v1/chat -H "Content-Type: application/json" \
            -d '{"tenant": "dentiste", "message": "Combien coûte un détartrage ?"}'
      - if: always()
        run: docker compose logs api

  # Vercel deploys the code on every push to main; this job brings the Neon database up to date.
  # Needs the repo secret NEON_DATABASE_URL_UNPOOLED, plus OPENAI_API_KEY or GEMINI_API_KEY
  # (with the variables LLM_PROVIDER=gemini and EMBEDDING_MODEL=gemini-embedding-2).
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      # Same provider and embedding model as the Vercel deployment (repo variables).
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
      - name: Skip when the database secret isn't set
        id: check
        run: echo "ready=${{ env.DATABASE_URL != '' && (env.OPENAI_API_KEY != '' || env.GEMINI_API_KEY != '') }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'true'
        run: uv sync --frozen --no-dev
      - name: Apply migrations
        if: steps.check.outputs.ready == 'true'
        run: uv run --no-dev alembic upgrade head
      - name: Embed the documents and load the examples
        if: steps.check.outputs.ready == 'true'
        run: uv run --no-dev python -m app.seed
