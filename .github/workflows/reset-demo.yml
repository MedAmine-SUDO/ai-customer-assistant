name: Reset demo

# Drops visitors' data older than 48 h and rebuilds the example conversations. A Vercel Schedule
# does the same every day; this is for doing it now (e.g. right after a schema change).
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      # Same provider and embedding model as the Vercel deployment (repo variables).
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev alembic upgrade head
      - run: uv run --no-dev python -m app.seed --reset
